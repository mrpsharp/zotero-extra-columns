<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <html:p class="extra-columns-intro" data-l10n-id="pref-intro"></html:p>

  <html:table class="extra-columns-table">
    <html:thead>
      <html:tr>
        <html:th data-l10n-id="pref-heading-label"></html:th>
        <html:th data-l10n-id="pref-heading-key"></html:th>
        <html:th data-l10n-id="pref-heading-type"></html:th>
        <html:th></html:th>
      </html:tr>
    </html:thead>
    <html:tbody id="__addonRef__-rows"></html:tbody>
  </html:table>

  <html:p
    id="__addonRef__-empty"
    class="extra-columns-empty"
    data-l10n-id="pref-empty"
  ></html:p>

  <hbox>
    <button id="__addonRef__-add" data-l10n-id="pref-add"></button>
  </hbox>

  <html:div
    id="__addonRef__-warnings"
    class="extra-columns-warnings"
    hidden="hidden"
  ></html:div>

  <html:p class="extra-columns-note" data-l10n-id="pref-note"></html:p>
</groupbox>
